<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="980" viewBox="0 0 1200 980">
  <rect width="1200" height="980" fill="#f3f5f9"/>
  <rect width="230" height="980" fill="#172238"/>
  <g font-family="Arial, sans-serif">
    <rect x="22" y="24" width="34" height="34" rx="9" fill="#3967d6"/>
    <path d="M29 36h20v13H29z M29 36l10 8 10-8" fill="none" stroke="#fff" stroke-width="1.7" stroke-linejoin="round"/>
    <text x="66" y="39" font-size="17" font-weight="bold" fill="#fff">gmail-cleanup</text>
    <text x="66" y="56" font-size="11" fill="#b9c9dd">A calmer inbox</text>
    <text x="24" y="105" font-size="11" letter-spacing="1" fill="#9eafc4">WORKSPACE</text>
    <g fill="none" stroke="#c6d4e4" stroke-width="1.7" stroke-linejoin="round"><rect x="28" y="128" width="18" height="13" rx="2"/><path d="M29 129l8 6 8-6"/><circle cx="37" cy="180" r="8"/><circle cx="37" cy="180" r="3"/></g>
    <text x="59" y="141" font-size="15" fill="#dbe5f1">Cleanup</text>
    <text x="59" y="185" font-size="15" fill="#dbe5f1">Settings</text>
    <rect x="13" y="202" width="204" height="44" rx="8" fill="#304866"/>
    <g fill="none" stroke="#fff" stroke-width="1.7"><circle cx="37" cy="224" r="9"/><path d="M34 221a3 3 0 0 1 6 0c0 2-3 2-3 5 M37 229v1"/></g>
    <text x="59" y="229" font-size="15" font-weight="bold" fill="#fff">Help &amp; Docs</text>
    <line x1="20" y1="795" x2="210" y2="795" stroke="#41516a"/>
    <circle cx="42" cy="833" r="18" fill="#3c5984"/>
    <text x="42" y="838" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">PE</text>
    <text x="72" y="829" font-size="14" font-weight="bold" fill="#fff">peter</text>
    <text x="72" y="848" font-size="12" fill="#becfe0">Signed in</text>
    <path d="M32 885h12m-5-5 5 5-5 5m-8-12h-4v14h4" fill="none" stroke="#c6d4e4" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="59" y="890" font-size="14" fill="#dbe5f1">Sign out</text>
    <text x="275" y="67" font-size="30" font-weight="bold" fill="#172238">Help &amp; Docs</text>
    <text x="275" y="97" font-size="15" fill="#526174">Practical help for connecting Gmail and cleaning up safely.</text>
    <rect x="275" y="127" width="870" height="635" rx="12" fill="#fff" stroke="#d7dee8"/>
    <rect x="305" y="151" width="182" height="25" rx="12" fill="#eaf0ff"/>
    <text x="318" y="168" font-size="12" font-weight="bold" fill="#2056bf">LOCAL OPERATOR GUIDE</text>
    <text x="305" y="211" font-size="23" font-weight="bold" fill="#172238">Set up Google authorization</text>
    <text x="305" y="239" font-size="14" fill="#526174">App sign-in is separate from permission to access your Google account.</text>
    <g font-size="15" fill="#172238">
      <text x="305" y="286" font-weight="bold">1. Prepare Google Cloud</text>
      <text x="327" y="311" fill="#526174">Enable the Gmail API, configure the OAuth consent screen and add test users.</text>
      <text x="305" y="356" font-weight="bold">2. Create a web application OAuth client</text>
      <text x="327" y="381" fill="#526174">Add this exact authorized redirect URI for the default local address:</text>
      <text x="327" y="407" font-family="monospace" font-size="14" fill="#2056bf">http://127.0.0.1:8100/oauth/google/callback</text>
      <text x="327" y="432" fill="#526174">Using another host or port? Register the matching callback URI instead.</text>
      <text x="305" y="477" font-weight="bold">3. Save the downloaded JSON privately</text>
      <text x="327" y="502" fill="#526174">In the app launch directory, set the path in your ignored .env file:</text>
      <text x="327" y="528" font-family="monospace" font-size="14" fill="#2056bf">GMAIL_WEB_CREDENTIALS_PATH="/private/path/client.json"</text>
      <text x="327" y="553" fill="#526174">Never paste the JSON or client secret into the app or commit it to Git.</text>
      <text x="305" y="598" font-weight="bold">4. Restart and connect</text>
      <text x="327" y="623" fill="#526174">Restart the local UI, then open Settings → Connect Google account.</text>
      <text x="327" y="648" fill="#526174">Choose a Google account and grant access. Test it from Settings.</text>
    </g>
    <line x1="305" y1="677" x2="1115" y2="677" stroke="#e1e7ef"/>
    <text x="305" y="704" font-size="14" fill="#526174">CLI users need a separate desktop OAuth client and Keychain authorization.</text>
    <text x="305" y="730" font-size="14" font-weight="bold" fill="#1955c4">CLI setup and troubleshooting →</text>
    <rect x="275" y="782" width="420" height="126" rx="12" fill="#fff" stroke="#d7dee8"/>
    <text x="305" y="821" font-size="17" font-weight="bold" fill="#172238">Preview before cleanup</text>
    <text x="305" y="848" font-size="14" fill="#526174">Select an account and age or date, then</text>
    <text x="305" y="870" font-size="14" fill="#526174">review the preview before confirming.</text>
    <rect x="715" y="782" width="430" height="126" rx="12" fill="#fff" stroke="#d7dee8"/>
    <text x="745" y="821" font-size="17" font-weight="bold" fill="#172238">Recover mail</text>
    <text x="745" y="848" font-size="14" fill="#526174">Restore messages in Gmail Trash before</text>
    <text x="745" y="870" font-size="14" fill="#526174">Google removes them, normally after 30 days.</text>
  </g>
</svg>
