<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="980" viewBox="0 0 1200 980">
  <rect width="1200" height="980" fill="#f3f5f9"/>
  <rect width="220" height="980" fill="#172238"/>
  <g font-family="Arial, sans-serif">
    <text x="28" y="52" font-size="21" font-weight="bold" fill="#fff">gmail-cleanup</text>
    <text x="30" y="123" font-size="16" fill="#fff">Cleanup</text>
    <text x="30" y="172" font-size="16" fill="#cbd5e1">Admin</text>
    <text x="260" y="70" font-size="30" font-weight="bold" fill="#172238">Clean up old mail</text>
    <rect x="260" y="135" width="880" height="760" rx="12" fill="#fff" stroke="#d7dee8"/>
    <rect width="1200" height="980" fill="#101828" opacity=".55"/>
    <rect x="358" y="215" width="540" height="430" rx="12" fill="#fff"/>
    <text x="390" y="263" font-size="23" font-weight="bold" fill="#172238">Move 200 messages to Trash?</text>
    <text x="390" y="302" font-size="15" font-weight="bold" fill="#172238">Google account: account-one@example.com</text>
    <text x="390" y="330" font-size="14" fill="#526174">Example confirmation — the preview defines what will move.</text>
    <text x="390" y="370" font-size="16" fill="#172238">Inbox: 120 messages older than 6 months</text>
    <text x="390" y="400" font-size="16" fill="#172238">Archive: 80 messages older than 3 months</text>
    <rect x="390" y="420" width="476" height="112" rx="7" fill="#fff5e8"/>
    <text x="405" y="444" font-size="14" fill="#7a4300">Trash affects all labels; Archive includes custom-labeled mail.</text>
    <text x="405" y="471" font-size="14" fill="#7a4300">Recover messages in Gmail Trash before Gmail removes them.</text>
    <text x="405" y="498" font-size="14" fill="#7a4300">Gmail normally deletes Trash after 30 days.</text>
    <rect x="605" y="560" width="104" height="42" rx="6" fill="#fff" stroke="#aab8ca"/>
    <text x="631" y="587" font-size="15" fill="#172238">Cancel</text>
    <rect x="723" y="560" width="143" height="42" rx="6" fill="#b42318"/>
    <text x="739" y="587" font-size="15" font-weight="bold" fill="#fff">Move to Trash</text>
  </g>
</svg>
