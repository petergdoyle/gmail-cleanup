<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="980" viewBox="0 0 1200 980">
  <rect width="1200" height="980" fill="#f3f5f9"/>
  <rect width="220" height="980" fill="#172238"/>
  <g font-family="Arial, sans-serif">
    <text x="28" y="52" font-size="21" font-weight="bold" fill="#fff">gmail-cleanup</text>
    <rect x="14" y="95" width="192" height="44" rx="8" fill="#294461"/>
    <text x="30" y="123" font-size="16" fill="#fff">Cleanup</text>
    <text x="30" y="172" font-size="16" fill="#cbd5e1">Admin</text>
    <text x="28" y="930" font-size="14" fill="#cbd5e1">Gmail: not tested</text>
    <text x="260" y="70" font-size="30" font-weight="bold" fill="#172238">Clean up old mail</text>
    <text x="260" y="103" font-size="16" fill="#526174">Select mailboxes and a cutoff. Preview before moving messages to Trash.</text>
    <rect x="260" y="135" width="880" height="132" rx="12" fill="#fff" stroke="#d7dee8"/>
    <text x="292" y="171" font-size="17" font-weight="bold" fill="#172238">Google account</text>
    <rect x="292" y="187" width="430" height="42" rx="6" fill="#fff" stroke="#b8c5d5"/>
    <text x="307" y="214" font-size="15" fill="#172238">Account 1 — account-one@example.com ▾</text>
    <rect x="748" y="187" width="140" height="42" rx="6" fill="#fff" stroke="#aab8ca"/>
    <text x="762" y="214" font-size="15" fill="#172238">← Previous</text>
    <rect x="902" y="187" width="122" height="42" rx="6" fill="#fff" stroke="#aab8ca"/>
    <text x="927" y="214" font-size="15" fill="#172238">Next →</text>
    <text x="292" y="251" font-size="13" fill="#526174">Account 1 of 2. Connect or manage accounts in Admin.</text>
    <g transform="translate(0 150)">
    <rect x="260" y="135" width="880" height="354" rx="12" fill="#fff" stroke="#d7dee8"/>
    <text x="292" y="177" font-size="20" font-weight="bold" fill="#172238">Mailboxes and age</text>
    <text x="292" y="206" font-size="14" fill="#526174">Select one or both. Set an age in months or a specific date for each.</text>
    <rect x="292" y="235" width="20" height="20" rx="4" fill="#2563eb"/>
    <text x="296" y="251" font-size="15" fill="#fff">✓</text>
    <text x="328" y="251" font-size="17" font-weight="bold" fill="#172238">Inbox</text>
    <text x="590" y="251" font-size="14" fill="#526174">Older than</text>
    <rect x="682" y="226" width="130" height="38" rx="6" fill="#fff" stroke="#b8c5d5"/>
    <text x="696" y="251" font-size="15" fill="#172238">6 months ▾</text>
    <text x="829" y="251" font-size="14" fill="#526174">or before</text>
    <rect x="904" y="226" width="185" height="38" rx="6" fill="#fff" stroke="#b8c5d5"/>
    <text x="917" y="251" font-size="14" fill="#526174">Select date</text>
    <line x1="292" y1="290" x2="1108" y2="290" stroke="#e1e7ef"/>
    <rect x="292" y="323" width="20" height="20" rx="4" fill="#2563eb"/>
    <text x="296" y="339" font-size="15" fill="#fff">✓</text>
    <text x="328" y="339" font-size="17" font-weight="bold" fill="#172238">Archive</text>
    <text x="328" y="364" font-size="13" fill="#526174">Received mail outside Inbox, Sent, Drafts, Spam and Trash, including custom labels</text>
    <text x="590" y="339" font-size="14" fill="#526174">Older than</text>
    <rect x="682" y="314" width="130" height="38" rx="6" fill="#fff" stroke="#b8c5d5"/>
    <text x="696" y="339" font-size="15" fill="#172238">3 months ▾</text>
    <text x="829" y="339" font-size="14" fill="#526174">or before</text>
    <rect x="904" y="314" width="185" height="38" rx="6" fill="#fff" stroke="#b8c5d5"/>
    <text x="917" y="339" font-size="14" fill="#526174">Select date</text>
    <rect x="292" y="410" width="158" height="44" rx="7" fill="#2563eb"/>
    <text x="325" y="438" font-size="16" font-weight="bold" fill="#fff">Preview</text>
    <text x="472" y="438" font-size="14" fill="#526174">Preview does not change your mail.</text>
    <rect x="260" y="514" width="880" height="250" rx="12" fill="#fff" stroke="#d7dee8"/>
    <text x="292" y="556" font-size="20" font-weight="bold" fill="#172238">Preview results</text>
    <text x="292" y="589" font-size="15" fill="#526174">Account: account-one@example.com · Example preview</text>
    <text x="292" y="629" font-size="16" fill="#172238">Inbox: 120 messages</text>
    <text x="580" y="629" font-size="16" fill="#172238">Archive: 80 messages</text>
    <text x="292" y="665" font-size="14" fill="#526174">200 messages total. Trash affects the whole message and all its labels.</text>
    <rect x="292" y="694" width="178" height="44" rx="7" fill="#b42318"/>
    <text x="311" y="722" font-size="15" font-weight="bold" fill="#fff">Move to Trash…</text>
    <text x="492" y="722" font-size="14" fill="#526174">Confirmation required; recover through Gmail Trash.</text>
    </g>
  </g>
</svg>
