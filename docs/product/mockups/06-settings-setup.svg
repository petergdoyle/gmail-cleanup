    <text x="59" y="185" font-size="15" font-weight="bold" fill="#fff">Settings</text>
    <g fill="none" stroke="#c6d4e4" stroke-width="1.7"><circle cx="37" cy="224" r="9"/><path d="M34 221a3 3 0 0 1 6 0c0 2-3 2-3 5 M37 229v1"/></g>
    <text x="59" y="229" font-size="15" fill="#dbe5f1">Help &amp; Docs</text>
    <line x1="20" y1="795" x2="210" y2="795" stroke="#41516a"/>
    <circle cx="42" cy="833" r="18" fill="#3c5984"/>
    <text x="42" y="838" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">PE</text>
    <text x="72" y="829" font-size="14" font-weight="bold" fill="#fff">peter</text>
