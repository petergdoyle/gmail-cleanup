    <path d="M32 885h12m-5-5 5 5-5 5m-8-12h-4v14h4" fill="none" stroke="#c6d4e4" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="59" y="890" font-size="14" fill="#dbe5f1">Sign out</text>
    <text x="275" y="67" font-size="30" font-weight="bold" fill="#172238">Settings</text>
    <text x="275" y="97" font-size="15" fill="#526174">Manage your Gmail accounts and personal preferences.</text>
    <rect x="275" y="128" width="870" height="346" rx="12" fill="#fff" stroke="#d7dee8"/>
    <text x="305" y="171" font-size="20" font-weight="bold" fill="#172238">Google accounts</text>
    <text x="305" y="201" font-size="15" fill="#526174">Connect the accounts you want to clean up. App sign-in is separate.</text>
    <rect x="305" y="222" width="224" height="43" rx="7" fill="#2563eb"/>
    <text x="320" y="249" font-size="15" font-weight="bold" fill="#fff">+ Connect Google account</text>
    <text x="305" y="299" font-size="14" fill="#526174">No Google accounts connected yet.</text>
    <rect x="305" y="322" width="810" height="122" rx="8" fill="#fff8e9" stroke="#e8c67d"/>
    <circle cx="327" cy="346" r="9" fill="#ac7109"/>
    <text x="327" y="350" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">!</text>
    <text x="347" y="350" font-size="15" font-weight="bold" fill="#704c0d">Google authorization needs setup</text>
    <text x="347" y="376" font-size="14" fill="#704c0d">The web OAuth client is not configured. If you run this app locally,</text>
    <text x="347" y="398" font-size="14" fill="#704c0d">follow the setup guide; otherwise ask your app operator for help.</text>
    <text x="347" y="425" font-size="14" font-weight="bold" fill="#1955c4">Open Google setup guide →</text>
    <rect x="275" y="497" width="870" height="140" rx="12" fill="#fff" stroke="#d7dee8"/>
    <text x="305" y="538" font-size="20" font-weight="bold" fill="#172238">Connection test</text>
    <text x="305" y="569" font-size="15" fill="#526174">No account selected. Connect a Google account to test its connection.</text>
    <text x="305" y="602" font-size="13" fill="#6b7a8d">A test result applies only to the selected account and current session.</text>
    <rect x="275" y="660" width="870" height="148" rx="12" fill="#fff" stroke="#d7dee8"/>
    <text x="305" y="701" font-size="20" font-weight="bold" fill="#172238">Appearance</text>
    <text x="305" y="731" font-size="15" fill="#526174">Choose how the app looks for your user.</text>
    <rect x="305" y="750" width="100" height="38" rx="6" fill="#eaf0ff" stroke="#2563eb"/>
    <text x="337" y="774" font-size="14" font-weight="bold" fill="#2563eb">Light</text>
    <rect x="416" y="750" width="100" height="38" rx="6" fill="#fff" stroke="#b8c5d5"/>
    <text x="447" y="774" font-size="14" fill="#172238">Dark</text>
    <text x="275" y="853" font-size="13" fill="#526174">Connection test examples: Not tested · Test succeeded · Test failed. Select an account first.</text>
